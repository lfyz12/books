spring.application.name=bookstore
server.port=8080
# Show exception messages (e.g. "not found") on the error page
server.error.include-message=always

# ---------- Database H2 (stored in file ./data/bookstore.mv.db) ----------
spring.datasource.url=jdbc:h2:file:./data/bookstore
spring.datasource.username=sa
spring.datasource.password=
# Hibernate creates/updates tables from entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
# Web console for the database: http://localhost:8080/h2-console (ADMIN only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------- Templates ----------
# Templates are re-read without restart (convenient during development)
spring.thymeleaf.cache=false

# ---------- Logging to a separate file ----------
logging.file.name=logs/bookstore.log
logging.level.ru.urfu.bookstore=INFO

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health,info,metrics,loggers,logfile,mappings,beans
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=Bookstore catalog
info.app.description=Course project: Spring Boot web application
info.app.version=1.0.0
