<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Ошибка')}"></head>
<body>
<!-- Общая страница ошибок: Spring Boot показывает её для любых ошибок, кроме 403 -->
<main class="container">
    <div class="card shadow-sm auth-card text-center">
        <div class="card-body p-4">
            <div class="display-4 mb-2">⚠️</div>
            <h1 class="h4">Ошибка <span th:text="${status}">500</span></h1>
            <p class="text-muted" th:text="${message ?: error}">Что-то пошло не так</p>
            <a th:href="@{/}" class="btn btn-primary">На главную</a>
        </div>
    </div>
</main>
</body>
</html>
