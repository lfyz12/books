<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Роли пользователей')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container" style="max-width: 900px">
    <h1 class="h3 mb-1">Роли пользователей</h1>
    <p class="text-muted">
        При регистрации пользователь получает роль READ_ONLY. Здесь администратор может выдать роль
        USER или ADMIN. Новая роль начинает действовать после повторного входа пользователя.
    </p>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card shadow-sm">
        <table class="table table-hover mb-0">
            <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>Логин</th>
                <th>Текущая роль</th>
                <th>Новая роль</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${users}">
                <td th:text="${u.id}">1</td>
                <td th:text="${u.username}">user</td>
                <td>
                    <span class="badge"
                          th:classappend="${u.role.name() == 'ADMIN'} ? 'bg-danger' : (${u.role.name() == 'USER'} ? 'bg-primary' : 'bg-secondary')"
                          th:text="${u.role}">USER</span>
                </td>
                <td>
                    <span th:if="${u.id == currentUser.id}" class="text-muted small">это вы</span>
                    <form th:unless="${u.id == currentUser.id}"
                          th:action="@{/admin/users/{id}/role(id=${u.id})}" method="post"
                          class="d-flex gap-2">
                        <select name="role" class="form-select form-select-sm" style="max-width: 160px">
                            <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"
                                    th:selected="${r == u.role}">ROLE</option>
                        </select>
                        <button type="submit" class="btn btn-sm btn-primary">Сохранить</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
