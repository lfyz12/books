<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Книги')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Книги</h1>
        <!-- Кнопка видна только тем, кто может добавлять записи -->
        <a sec:authorize="hasAnyRole('USER', 'ADMIN')" th:href="@{/books/new}" class="btn btn-success">
            + Добавить книгу
        </a>
    </div>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>Название</th>
                    <th>Автор</th>
                    <th>Жанр</th>
                    <th>Год</th>
                    <th class="text-end text-nowrap">Цена, ₽</th>
                    <th class="text-end text-nowrap">Кол-во</th>
                    <th>Магазин</th>
                    <th>Создал</th>
                    <th sec:authorize="hasAnyRole('USER', 'ADMIN')"></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="book : ${books}">
                    <td th:text="${book.title}">Название</td>
                    <td th:text="${book.author}">Автор</td>
                    <td th:text="${book.genre}">Жанр</td>
                    <td th:text="${book.publishYear}">2000</td>
                    <td class="text-end text-nowrap"
                        th:text="${#numbers.formatDecimal(book.price, 1, 'WHITESPACE', 2, 'COMMA')}">0</td>
                    <td class="text-end" th:text="${book.quantity}">0</td>
                    <td th:text="${book.store.name}">Магазин</td>
                    <td th:text="${book.owner?.username}">admin</td>
                    <td sec:authorize="hasAnyRole('USER', 'ADMIN')" class="actions text-end">
                        <a th:href="@{/books/{id}/edit(id=${book.id})}" class="btn btn-sm btn-outline-primary">Изменить</a>
                        <form th:action="@{/books/{id}/delete(id=${book.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('Удалить книгу?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Удалить</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(books)}">
                    <td colspan="9" class="text-center text-muted py-4">Книг пока нет</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
