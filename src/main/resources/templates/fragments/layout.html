<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--
  Общие части страниц. Подключаются в других шаблонах через th:replace:
  head    - заголовок страницы и стили,
  navbar  - верхнее меню (пункты зависят от роли пользователя),
  footer  - подвал.
-->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' — Книжный каталог'">Книжный каталог</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid px-4 flex-wrap">
        <a class="navbar-brand" th:href="@{/}">📚 Книжный каталог</a>
        <ul class="navbar-nav flex-row flex-wrap me-auto">
            <li class="nav-item"><a class="nav-link" th:href="@{/}">Главная</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/books}">Книги</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/stores}">Магазины</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/calculator}">Расчёт стоимости</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/logs}">Журнал</a></li>
            <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                <a class="nav-link" th:href="@{/admin/users}">Роли</a>
            </li>
            <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                <a class="nav-link" th:href="@{/actuator}" target="_blank">Actuator</a>
            </li>
            <li class="nav-item"><a class="nav-link" th:href="@{/about}">О приложении</a></li>
        </ul>
        <div class="d-flex align-items-center gap-2 text-light">
            <span sec:authentication="name">user</span>
            <span sec:authorize="hasRole('ADMIN')" class="badge bg-danger">ADMIN</span>
            <span sec:authorize="hasRole('USER')" class="badge bg-primary">USER</span>
            <span sec:authorize="hasRole('READ_ONLY')" class="badge bg-secondary">READ_ONLY</span>
            <form th:action="@{/logout}" method="post" class="ms-2">
                <button type="submit" class="btn btn-outline-light btn-sm">Выйти</button>
            </form>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="container text-center text-muted small py-4">
    Курсовой проект · Spring Boot · 2026
</footer>

</body>
</html>
